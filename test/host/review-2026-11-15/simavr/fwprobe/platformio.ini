; Real-firmware millis-rate probe: src/main.cpp verbatim, with the firmware's own codegen flags.
[env:fwprobe]
platform = atmelavr
board = sparkfun_promicro16
framework = arduino
lib_deps = EEPROM
lib_ldf_mode = deep+
build_flags =
    -I../../../../../include
    -I../../../../../src
    -mrelax
    -Wl,--relax
    -mcall-prologues
    -fno-inline-small-functions
    -fno-move-loop-invariants
    --param=max-inline-insns-auto=2
    -DWDP_FW='"probe00"'
