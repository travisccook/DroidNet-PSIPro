; millis() rate probe: the firmware (src/main.cpp verbatim) with one contract look at a time, in
; simavr. Run by test/host/run.sh; see test/simavr/README.md.
[env:millis]
platform = atmelavr
board = sparkfun_promicro16
framework = arduino
lib_deps = EEPROM
lib_ldf_mode = deep+
; simavr has no bootloader, so the probe may use the whole 32 KB (the firmware plus the probe does
; not fit the 28,672 B a real board leaves).
board_upload.maximum_size = 32256
build_flags =
    -I../../../include
    -I../../../src
    -mrelax
    -Wl,--relax
    -mcall-prologues
    -fno-inline-small-functions
    -fno-move-loop-invariants
    --param=max-inline-insns-auto=2
    -DWDP_FW='"probe00"'
    -DPSI_NO_STRIP_LOOKS

; The same probe on the firmware as the PSIPro-i2c environment builds it: the I2C intake, no
; contract layer. Its rows are native modes, started by their commands.
[env:millis_i2c]
extends = env:millis
lib_deps =
    EEPROM
    Wire
build_flags =
    ${env:millis.build_flags}
    -DPSI_ENABLE_I2C
    -DPSI_NO_CONTRACT
